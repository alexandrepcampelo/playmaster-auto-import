name: Validate PlayMaster Auto Import

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/deploy-test.yml'

permissions:
  contents: read

concurrency:
  group: auto-import-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  deploy-test:
    needs: validate
    if: >-
      github.event.pull_request.head.ref == 'feature/catalog-folder-hierarchy' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated pull request
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy only to test directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          TEST_PATH=/opt/playmaster-auto-import-test
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$TEST_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'storage/' \
            --exclude 'docker-compose.test.yml' \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$TEST_PATH/"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$TEST_PATH' && docker compose -f docker-compose.test.yml up -d --build --remove-orphans"
          for attempt in $(seq 1 30); do
            if ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "curl -fsS http://127.0.0.1:3602/api/health >/dev/null"; then
              echo "TEST_HEALTH: passed"
              exit 0
            fi
            sleep 3
          done
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$TEST_PATH' && docker compose -f docker-compose.test.yml logs --tail=100"
          echo "TEST_HEALTH: failed" >&2
          exit 1
