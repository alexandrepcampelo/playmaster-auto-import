name: Deploy Auto Import to test VPS

on:
  workflow_run:
    workflows: ["Validate PlayMaster Auto Import"]
    types: [completed]
    branches: [feature/catalog-folder-hierarchy]

permissions:
  contents: read

concurrency:
  group: playmaster-auto-import-test
  cancel-in-progress: true

jobs:
  deploy-test:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feature/catalog-folder-hierarchy' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy only to test directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          TEST_PATH=/opt/playmaster-auto-import-test
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$TEST_PATH'"
          rsync -az --delete \\
            --exclude '.git/' \\
            --exclude '.env' \\
            --exclude 'data/' \\
            --exclude 'storage/' \\
            --exclude 'docker-compose.test.yml' \\
            -e "ssh -p $VPS_PORT" \\
            ./ "$VPS_USER@$VPS_HOST:$TEST_PATH/"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$TEST_PATH' && docker compose -f docker-compose.test.yml up -d --build --remove-orphans"
          for attempt in $(seq 1 30); do
            if ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "curl -fsS http://127.0.0.1:3602/api/health >/dev/null"; then
              echo "TEST_HEALTH: passed"
              exit 0
            fi
            sleep 3
          done
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$TEST_PATH' && docker compose -f docker-compose.test.yml logs --tail=100"
          echo "TEST_HEALTH: failed" >&2
          exit 1
