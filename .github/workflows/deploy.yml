name: Deploy PlayMaster Auto Import

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playmaster-auto-import-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validar projeto
        run: |
          npm install
          npm run check
          npm test

      - name: Preparar acesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Criar pasta de produção
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Enviar arquivos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: >-
          rsync -az --delete
          --exclude '.git/'
          --exclude 'data/'
          --exclude 'storage/'
          -e "ssh -p $VPS_PORT"
          ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Atualizar serviço
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          AUTO_IMPORT_ADMIN_USER: ${{ secrets.AUTO_IMPORT_ADMIN_USER }}
          AUTO_IMPORT_ADMIN_PASSWORD: ${{ secrets.AUTO_IMPORT_ADMIN_PASSWORD }}
          AUTO_IMPORT_API_TOKEN: ${{ secrets.AUTO_IMPORT_API_TOKEN }}
          AUTO_IMPORT_SESSION_SECRET: ${{ secrets.AUTO_IMPORT_SESSION_SECRET }}
        run: |
          ADMIN_PASSWORD_B64=$(printf '%s' "$AUTO_IMPORT_ADMIN_PASSWORD" | base64 -w 0)
          API_TOKEN_B64=$(printf '%s' "$AUTO_IMPORT_API_TOKEN" | base64 -w 0)
          SESSION_SECRET_B64=$(printf '%s' "$AUTO_IMPORT_SESSION_SECRET" | base64 -w 0)
          printf '%s\n' \
            "AUTO_IMPORT_ADMIN_USER=$AUTO_IMPORT_ADMIN_USER" \
            "AUTO_IMPORT_ADMIN_PASSWORD_B64=$ADMIN_PASSWORD_B64" \
            "AUTO_IMPORT_API_TOKEN_B64=$API_TOKEN_B64" \
            "AUTO_IMPORT_SESSION_SECRET_B64=$SESSION_SECRET_B64" > .env.production
          chmod 600 .env.production
          scp -P "$VPS_PORT" .env.production "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/.env"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            docker compose up -d --build --remove-orphans
            for attempt in \$(seq 1 20); do
              if curl -fsS http://127.0.0.1:3600/api/health >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail=80 playmaster-auto-import
            exit 1
          "

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          DOMAIN=autoimport.apcgestor.com.br
          ROUTE=/etc/nginx/sites-available/playmaster-auto-import-apcgestor
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          ${SUDO} mkdir -p /var/www/acme
          ${SUDO} tee "$ROUTE" >/dev/null <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name autoimport.apcgestor.com.br;
              location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
              location / {
                  proxy_pass http://127.0.0.1:3600;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300;
              }
          }
          NGINX
          ${SUDO} ln -sfn "$ROUTE" /etc/nginx/sites-enabled/playmaster-auto-import-apcgestor
          ${SUDO} nginx -t
          ${SUDO} systemctl reload nginx

          if command -v certbot >/dev/null 2>&1; then
            if getent ahostsv4 "$DOMAIN" >/dev/null 2>&1; then
              if ${SUDO} certbot certonly --webroot -w /var/www/acme -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email; then
                echo "Certificado HTTPS confirmado para $DOMAIN."
              else
                echo "Aviso: Certbot não conseguiu emitir o certificado de $DOMAIN; o acesso HTTP continua disponível."
              fi
              if [ -s "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ] && [ -s "/etc/letsencrypt/live/$DOMAIN/privkey.pem" ]; then
                ${SUDO} tee "$ROUTE" >/dev/null <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name autoimport.apcgestor.com.br;
              location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
              location / { return 301 https://$host$request_uri; }
          }
          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name autoimport.apcgestor.com.br;
              ssl_certificate /etc/letsencrypt/live/autoimport.apcgestor.com.br/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/autoimport.apcgestor.com.br/privkey.pem;
              location / {
                  proxy_pass http://127.0.0.1:3600;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300;
              }
          }
          NGINX
                ${SUDO} nginx -t
                ${SUDO} systemctl reload nginx
              fi
            else
              echo "DNS de $DOMAIN ainda não está configurado; o site HTTP fica preparado e o HTTPS será ativado no próximo deploy."
            fi
          else
            echo "Certbot não encontrado; o subdomínio HTTP está configurado."
          fi
          REMOTE

      - name: Validar subdomínio Auto Import
        run: |
          curl --connect-timeout 8 --max-time 20 -fsS "https://autoimport.apcgestor.com.br/api/health" -o /tmp/autoimport-health.json
          echo "Health do Auto Import pelo subdomínio: $(cat /tmp/autoimport-health.json)"
