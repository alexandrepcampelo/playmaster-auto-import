name: PlayMaster VPS test bridge

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only operation to run on the VPS
        required: true
        type: choice
        options:
          - test-status
          - nginx-config-test
          - test-http-check
          - test-domain-inspect
          - test-domain-enable-https
          - test-domain-https-check

permissions:
  contents: read

concurrency:
  group: playmaster-vps-test-bridge
  cancel-in-progress: false

jobs:
  run-allowlisted-action:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH key fingerprint
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Run fixed VPS operation
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          case "$ACTION" in
            test-status|nginx-config-test|test-http-check|test-domain-inspect|test-domain-enable-https|test-domain-https-check) ;;
            *) echo "Operation not allowed"; exit 2 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" "action:$ACTION"
