services:
  playmaster-auto-import:
    build: .
    container_name: playmaster-auto-import
    restart: unless-stopped
    environment:
      PORT: 3600
      DATA_DIR: /app/data
      INBOX_DIR: /app/storage/inbox
      ORIGINALS_DIR: /app/storage/originals
      STATION_CODE: PM
      POLL_INTERVAL_MS: 3000
      AUTO_IMPORT_ADMIN_USER: ${AUTO_IMPORT_ADMIN_USER:-admin}
      AUTO_IMPORT_ADMIN_PASSWORD_B64: ${AUTO_IMPORT_ADMIN_PASSWORD_B64:?Configure AUTO_IMPORT_ADMIN_PASSWORD_B64}
      AUTO_IMPORT_API_TOKEN_B64: ${AUTO_IMPORT_API_TOKEN_B64:?Configure AUTO_IMPORT_API_TOKEN_B64}
      AUTO_IMPORT_SESSION_SECRET_B64: ${AUTO_IMPORT_SESSION_SECRET_B64:?Configure AUTO_IMPORT_SESSION_SECRET_B64}
    ports:
      - "127.0.0.1:3600:3600"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
